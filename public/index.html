      <p class="wordmark">officebit</p>
      <p class="loading-note">Waking the town up…</p>
    </div>
    <!-- The menu bar: officebit, where you're looking, and the time (tap the clock to jump ahead). -->
    <header class="menubar">
      <strong class="wordmark">officebit</strong>
      <span class="place-name" id="place" aria-live="polite"></span>
      <div class="status-items">
        <span class="popover-anchor"
          ><button type="button" class="clock mdst-button--sm mdst-button--ghost" id="clock" title="Jump ahead to another time">
            Day 1 · 06:00
          </button></span
        >
        <span class="popover-anchor"
          ><button type="button" class="icon-button mdst-button--sm mdst-button--ghost" id="music" aria-expanded="false"></button
        ></span>
        <button
          type="button"
          class="icon-button mdst-button--sm mdst-button--ghost"
          id="play-pause"
          aria-label="Pause"
          title="Pause (space)"
        ></button>
        <span class="popover-anchor">
          <button
            type="button"
            class="icon-button mdst-button--sm mdst-button--ghost"
            id="speed"
            data-icon="speed"
            aria-label="Time and speed"
            title="Time and speed"
            aria-expanded="false"
          ></button>
          <div class="speed-menu popover mdst-card mdst-card--compact" id="speed-menu" hidden>
            <select id="mode" aria-label="Time" class="mdst-dropdown--sm" title="Live follows your clock; Sandbox lets you speed up">
              <option value="live">Live: follows your clock</option>
              <option value="sandbox">Sandbox: pick a speed</option>
            </select>
            <p class="since mdst-p--sm" id="since" hidden>
              <span id="since-date"></span>
              <button type="button" class="link" id="start-afresh">Start afresh today</button>
            </p>
            <fieldset class="speeds" aria-label="Speed">
              <button type="button" class="mdst-button--sm" data-speed="1">1×</button>
              <button type="button" class="mdst-button--sm" data-speed="4">4×</button>
              <button type="button" class="mdst-button--sm" data-speed="16">16×</button>
              <button type="button" class="mdst-button--sm" data-speed="60">60×</button>
            </fieldset>
          </div>
        </span>
        <button
          type="button"
          class="icon-button mdst-button--sm mdst-button--ghost sidebar-toggle"
          id="sidebar-toggle"
          data-icon="sidebar"
          aria-pressed="true"
          aria-label="Hide the sidebar"
          title="Hide the sidebar"
        ></button>
      </div>
    </header>

    <main>
      <section id="stage" aria-label="Office">
        <!-- Floating over the map: the tool rail (top left), zoom (bottom right), and a chip while following someone. -->
        <div class="hud hud-tools mdst-card mdst-card--compact" role="toolbar" aria-label="Tools">
          <button
            type="button"
            class="icon-button mdst-button--sm mdst-button--ghost"
            id="back"
            data-icon="back"
            aria-label="Back (Alt+←)"
            title="Back (Alt+←)"
            disabled
          ></button>
          <button
            type="button"
            class="icon-button mdst-button--sm mdst-button--ghost"
            id="to-town"
            data-icon="town"
            aria-label="Back to town"
            title="Back to town"
          ></button>
          <button
            type="button"
            class="icon-button mdst-button--sm mdst-button--ghost"
            id="edit"
            data-icon="edit"
            aria-label="Edit the map"
            title="Edit the map"
            aria-pressed="false"
          ></button>
          <span class="popover-anchor"
            ><button
              type="button"
              class="icon-button mdst-button--sm mdst-button--ghost"
              id="share"
              data-icon="share"
              aria-label="Save and share"
              title="Save and share"
            ></button
          ></span>
        </div>
        <fieldset class="hud hud-zoom mdst-card mdst-card--compact" aria-label="Zoom">
          <button
            type="button"
            class="icon-button mdst-button--sm mdst-button--ghost"
            id="zoom-in"
            data-icon="add"
            aria-label="Zoom in (+)"
            title="Zoom in (+)"
          ></button>
          <output class="zoom-level" id="zoom-level">3×</output>
          <button
            type="button"
            class="icon-button mdst-button--sm mdst-button--ghost"
            id="zoom-out"
            data-icon="minus"
            aria-label="Zoom out (−)"
            title="Zoom out (−)"
          ></button>
        </fieldset>
        <button type="button" class="hud follow-chip mdst-button--sm mdst-button--inverted" id="follow" hidden></button>
        <div id="steer" class="travel steer mdst-card mdst-card--compact" hidden>
          <span class="mdst-p--sm">Steering <strong></strong>: tap to walk, use things or talk to people</span
          ><button type="button" class="mdst-button--sm mdst-button--inverted" data-action="let-go">Let go</button>
        </div>
        <div id="travel" class="travel mdst-card mdst-card--compact" hidden>
          <span class="mdst-p--sm">Jumping ahead…</span><progress max="1"></progress
          ><button type="button" class="mdst-button--sm" data-action="stop">Stop here</button>
        </div>
      </section>
      <aside class="mdst-tabs mdst-tabs--compact">
        <div class="mdst-tabs-list" role="tablist">
          <button type="button" class="mdst-tab" role="tab" data-tab="world" data-icon="world" data-state="active">World</button>
          <button type="button" class="mdst-tab" role="tab" data-tab="people" data-icon="people" data-state="inactive">People</button>
          <button type="button" class="mdst-tab" role="tab" data-tab="news" data-icon="news" data-state="inactive">News</button>
        </div>
        <section class="mdst-tabs-panel" data-panel="world" data-state="active" id="overview" aria-label="The world"></section>
        <section class="mdst-tabs-panel" data-panel="people" data-state="inactive" id="directory" aria-label="Everyone"></section>
        <section class="mdst-tabs-panel" data-panel="news" data-state="inactive" id="news" aria-label="News"></section>
      </aside>
    </main>
  </body>
</html>
